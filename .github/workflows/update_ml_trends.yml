name: Atualização diária de tendências de marketplace

on:
  schedule:
    # 08:00 no horário de Brasília (UTC-3).
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Refresh official Mercado Livre and Amazon sources
        run: |
          python - <<'PY'
          from modules.amazon_scraper import capturar_bestsellers_amazon
          from modules.mercadolivre_scraper import forcar_atualizacao_ml

          mercado_livre = forcar_atualizacao_ml()
          amazon = capturar_bestsellers_amazon(forcar=True)

          if not mercado_livre:
              raise SystemExit("Nenhuma tendência oficial do Mercado Livre foi confirmada.")
          if not amazon:
              raise SystemExit("Nenhum Best Seller oficial da Amazon foi confirmado nem existe cache oficial válido.")

          print(f"Mercado Livre oficial: {len(mercado_livre)} termos")
          print(f"Amazon oficial ou último cache validado: {len(amazon)} produtos")
          PY

      - name: Refresh filtered Shopee daily trends
        run: python scraping_shopee_v2.py

      - name: Refresh verified Google Shopping fashion trends
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "SERPAPI_KEY não configurada; removendo cache antigo de moda para não exibir dados vencidos."
            rm -f moda_trends_serpapi_cache.json
          else
            python - <<'PY'
            from modules.tendencias_moda_serpapi import obter_tendencias_moda_serpapi

            dados = obter_tendencias_moda_serpapi(forcar_atualizacao=True)
            if not dados:
                raise SystemExit("Google Shopping não retornou dados confirmados para moda.")
            if not all(item.get("metrica_verificada") for item in dados):
                raise SystemExit("A coleta de moda contém item sem métrica verificada.")
            print(f"Google Shopping moda: {len(dados)} termos confirmados")
            PY
          fi

      - name: Verify source provenance and adult-content exclusion
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from modules.adult_content_filter import eh_termo_adulto

          expected = {
              "ml_trends_cache.json": "https://tendencias.mercadolivre.com.br/",
              "amazon_trends.json": "https://www.amazon.com.br/gp/bestsellers/",
          }
          for path, source_url in expected.items():
              with open(path, encoding="utf-8") as file:
                  payload = json.load(file)
              assert payload.get("url_fonte") == source_url, f"Fonte inválida em {path}"
              assert payload.get("origem_coleta") == "pagina_oficial", f"Origem inválida em {path}"
              assert payload.get("status_coleta") == "sucesso", f"Status inválido em {path}"
              assert isinstance(payload.get("produtos"), dict) and payload["produtos"], f"Sem produtos em {path}"

          with open("shopee_daily_cache.json", encoding="utf-8") as file:
              shopee = json.load(file)
          termos = shopee.get("termos", [])
          assert shopee.get("data_coleta") == date.today().isoformat(), "Cache Shopee não é do dia"
          assert termos, "Nenhuma tendência Shopee válida foi registrada"
          assert all(not eh_termo_adulto(termo) for termo in termos), "Conteúdo adulto chegou ao cache"
          assert "Brinquedo Sexual Masculino" not in termos, "Termo adulto não foi excluído"
          print(f"Shopee diária: {len(termos)} termos seguros; {shopee.get('termos_bloqueados', 0)} bloqueados")
          PY

      - name: Commit refreshed data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add ml_trends_cache.json amazon_trends.json
          git add -A -- moda_trends_serpapi_cache.json
          git add -f shopee_daily_cache.json shopee_trends.json
          git commit -m "chore(data): atualização diária de tendências" || exit 0
          git push
